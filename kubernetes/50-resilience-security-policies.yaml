# Final project: elasticity, disruption control and zero-trust networking.
# Requires metrics-server (HPA) and a CNI that enforces NetworkPolicy (Calico, Cilium, ...).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler          # scale the edge and the write-heavy service out under load (exam/payment peaks)
metadata: {name: gateway, namespace: uni}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2                       # never below 2: the gateway must not be a single point of failure
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 120}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: payment, namespace: uni}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: StatefulSet, name: payment}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gateway, namespace: uni}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: gateway}}
---
# Zero-trust: deny all ingress by default, then allow only the documented call graph.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: uni}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-from-ingress, namespace: uni}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8000}]            # clients (via ingress controller / LoadBalancer) reach only the gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: services-from-gateway-and-prometheus, namespace: uni}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [payment, academic]}]}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: gateway}}}, {podSelector: {matchLabels: {app: prometheus}}}]
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: student-from-gateway-peers-prometheus, namespace: uni}
spec:
  podSelector: {matchLabels: {app: student}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [payment, academic]}]}   # internal HMAC calls
        - podSelector: {matchLabels: {app: prometheus}}
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-from-services, namespace: uni}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchExpressions: [{key: app, operator: In, values: [student, payment, academic, postgres]}]}}]
      ports: [{port: 5432}]
