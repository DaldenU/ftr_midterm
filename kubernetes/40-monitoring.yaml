apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: uni}
data:
  prometheus.yml: |
    global: {scrape_interval: 5s}
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: uni-pods
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [uni]}}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: uni}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus, namespace: uni}
rules: [{apiGroups: [""], resources: [pods], verbs: [get, list, watch]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: uni}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: uni}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: uni}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: cfg, mountPath: /etc/prometheus}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes: [{name: cfg, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: uni}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
