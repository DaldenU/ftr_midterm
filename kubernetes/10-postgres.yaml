apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: uni}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432, name: pg}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: uni}
spec:
  serviceName: postgres
  replicas: 1                      # add a streaming replica via an operator (CloudNativePG/Zalando) for DB-tier HA
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_USER, value: uni}
            - {name: POSTGRES_DB, value: uni_ft}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: uni-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "uni", "-d", "uni_ft"]}
            periodSeconds: 3
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "uni", "-d", "uni_ft"]}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: init
          configMap: {name: db-init}      # kubectl -n uni create configmap db-init --from-file=../database/schema_ft.sql --from-file=../database/seed.sql
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
