apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: uni}
spec:
  replicas: 2                          # the gateway itself must not be a single point of failure
  selector: {matchLabels: {app: gateway}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata:
      labels: {app: gateway}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: gateway
          image: uni-gateway:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: uni-config}}]
          env:
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: uni-secrets, key: JWT_SECRET}}}
            - {name: ADMIN_TOKEN, valueFrom: {secretKeyRef: {name: uni-secrets, key: ADMIN_TOKEN}}}
          volumeMounts: [{name: users, mountPath: /run/secrets/uis, readOnly: true}]
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false,
                            readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
      volumes:
        - name: users
          secret: {secretName: uni-secrets, items: [{key: users.json, path: users.json}]}
---
apiVersion: v1
kind: Service                          # kube-proxy load-balances over the ready gateway pods
metadata: {name: gateway, namespace: uni}
spec:
  type: ClusterIP
  selector: {app: gateway}
  ports: [{port: 8000, targetPort: 8000}]
