# TEMPLATE (not applied by default) - never commit real credentials. Create the secret from generated values:
#   python scripts/gen_secrets.py
#   kubectl -n uni create secret generic uni-secrets --from-env-file=.env --from-file=users.json=secrets/users.json
apiVersion: v1
kind: Secret
metadata:
  name: uni-secrets
  namespace: uni
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<generated>"
  DATABASE_URL: "postgresql://uni:<generated>@postgres:5432/uni_final"
  JWT_SECRET: "<generated, >= 32 chars>"
  INTERNAL_AUTH_SECRET: "<generated, >= 32 chars>"
  ADMIN_TOKEN: "<generated, >= 32 chars>"
  users.json: "{}"
