global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:8000"]}]
  - job_name: student-service
    static_configs: [{targets: ["student:8000"]}]
  - job_name: payment-service
    static_configs: [{targets: ["payment:8000"]}]
  - job_name: academic-service
    static_configs: [{targets: ["academic:8000"]}]
